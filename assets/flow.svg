<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="1020" height="300" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="1020" height="300" rx="10" fill="#fcfcfb" stroke="#d8d7d2"/>
  <text x="20" y="30" font-size="16" font-weight="bold" fill="#0b0b0b">RTL to GDSII flow used in this project (4-bit counter)</text>

  <!-- boxes: x = 20, 220, 420, 620, 820 ; each 170 wide -->
  <g font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="middle">
    <rect x="20"  y="55" width="170" height="70" rx="8" fill="#e5e5e5" stroke="#52514e"/>
    <text x="105" y="85">RTL</text><text x="105" y="105" font-size="11" font-weight="normal">counter.v</text>

    <rect x="220" y="55" width="170" height="70" rx="8" fill="#cfe3fb" stroke="#52514e"/>
    <text x="305" y="85">Xcelium</text><text x="305" y="105" font-size="11" font-weight="normal">simulate (xrun)</text>

    <rect x="420" y="55" width="170" height="70" rx="8" fill="#d7f0e4" stroke="#52514e"/>
    <text x="505" y="85">Genus</text><text x="505" y="105" font-size="11" font-weight="normal">logic synthesis</text>

    <rect x="620" y="55" width="170" height="70" rx="8" fill="#fde4cf" stroke="#52514e"/>
    <text x="705" y="85">Innovus</text><text x="705" y="105" font-size="11" font-weight="normal">place &amp; route</text>

    <rect x="820" y="55" width="170" height="70" rx="8" fill="#e8e0f7" stroke="#52514e"/>
    <text x="905" y="85">GDSII</text><text x="905" y="105" font-size="11" font-weight="normal">counter.gds</text>
  </g>

  <!-- arrows between boxes, labelled with the file handed over -->
  <g stroke="#52514e" stroke-width="2" marker-end="url(#a)">
    <line x1="190" y1="90" x2="218" y2="90"/><line x1="390" y1="90" x2="418" y2="90"/>
    <line x1="590" y1="90" x2="618" y2="90"/><line x1="790" y1="90" x2="818" y2="90"/>
  </g>

  <!-- what each stage consumes / produces -->
  <g font-size="11" fill="#52514e" text-anchor="middle">
    <text x="305" y="150">in: counter.v + tb_counter.v</text>
    <text x="305" y="165">out: waveform / console log</text>
    <text x="505" y="150">in: counter.v + .lib + SDC</text>
    <text x="505" y="165">out: netlist.v, constraints.sdc, reports</text>
    <text x="705" y="150">in: netlist + SDC + LEF</text>
    <text x="705" y="165">out: routed.v, .def, drc report, .gds</text>
    <text x="905" y="150">final layout</text>
    <text x="905" y="165">(foundry hand-off format)</text>
  </g>

  <!-- honest status line per stage: symbol + words, never colour alone -->
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#0b0b0b">
    <text x="105" y="205">&#10003; written</text>
    <text x="305" y="205">&#9888; compile + elaborate OK</text>
    <text x="305" y="222" font-weight="normal" font-size="11">run step crashed (tool issue)</text>
    <text x="305" y="239" font-weight="normal" font-size="11">&#10003; RTL re-checked outside Cadence</text>
    <text x="505" y="205">&#10003; setup slack +9586 ps</text>
    <text x="505" y="222" font-weight="normal" font-size="11">14 cells, 99.9 area units</text>
    <text x="705" y="205">&#10003; verify_drc: 0 violations</text>
    <text x="905" y="205">&#10003; streamed out</text>
  </g>
  <text x="20" y="270" font-size="11" fill="#52514e">Not done: Xcelium simulation run, gate-level simulation, post-route timing (Tempus), LVS. See "Verification status" in the README.</text>
</svg>
