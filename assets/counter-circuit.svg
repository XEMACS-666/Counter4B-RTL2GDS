<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="775" viewBox="0 0 1100 775" role="img"><title>RTL-equivalent four-bit synchronous counter circuit</title><rect width="1100" height="775" fill="#101c30" rx="16"/><g font-family="Arial,Helvetica,sans-serif"><text x="35" y="44" font-size="27" fill="#dbe8fa" text-anchor="start">RTL-equivalent synchronous counter circuit</text><text x="35" y="76" font-size="16" fill="#9eb4d2" text-anchor="start">Four rising-edge D flip-flops · reset acts on D, never on an asynchronous reset pin</text><text x="35" y="150" font-size="20" fill="#68dfc3" text-anchor="start">Bit 0</text><text x="35" y="180" font-size="15" fill="#dbe8fa" text-anchor="start">Q0 = count[0]</text><text x="190" y="133" font-size="16" fill="#dbe8fa" text-anchor="start">1</text><path d="M190 143 L380 143" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="255" y="189" font-size="16" fill="#dbe8fa" text-anchor="start">Q0</text><path d="M290 183 L380 183" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="380" y="125" width="85" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="422" y="171" font-size="20" fill="#dbe8fa" text-anchor="middle">XOR</text><path d="M465 163 L555 163" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="555" y="125" width="95" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="602" y="171" font-size="20" fill="#dbe8fa" text-anchor="middle">AND</text><text x="500" y="116" font-size="14" fill="#ffcf80" text-anchor="start">NOT rst</text><path d="M530 121 L575 121" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M575 121 L575 125" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M650 163 L760 163" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="680" y="151" font-size="16" fill="#dbe8fa" text-anchor="start">D0</text><rect x="760" y="125" width="110" height="86" rx="8" fill="#20334f" stroke="#5e789c"/><text x="775" y="169" font-size="18" fill="#dbe8fa" text-anchor="start">D</text><text x="845" y="169" font-size="18" fill="#dbe8fa" text-anchor="start">Q</text><text x="815" y="143" font-size="16" fill="#dbe8fa" text-anchor="middle">DFF</text><path d="M870 163 L1010 163" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="925" y="150" font-size="18" fill="#68dfc3" text-anchor="start">Q0</text><path d="M760 185 L772 193 L760 201" fill="none" stroke="#75b8ff" stroke-width="2"/><path d="M720 193 L760 193" stroke="#75b8ff" stroke-width="2" fill="none"/><path d="M720 193 L720 328" stroke="#75b8ff" stroke-width="2" fill="none"/><text x="35" y="285" font-size="20" fill="#68dfc3" text-anchor="start">Bit 1</text><text x="35" y="315" font-size="15" fill="#dbe8fa" text-anchor="start">Q1 = count[1]</text><text x="190" y="268" font-size="16" fill="#dbe8fa" text-anchor="start">Q0</text><path d="M190 278 L380 278" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="255" y="324" font-size="16" fill="#dbe8fa" text-anchor="start">Q1</text><path d="M290 318 L380 318" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="380" y="260" width="85" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="422" y="306" font-size="20" fill="#dbe8fa" text-anchor="middle">XOR</text><path d="M465 298 L555 298" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="555" y="260" width="95" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="602" y="306" font-size="20" fill="#dbe8fa" text-anchor="middle">AND</text><text x="500" y="251" font-size="14" fill="#ffcf80" text-anchor="start">NOT rst</text><path d="M530 256 L575 256" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M575 256 L575 260" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M650 298 L760 298" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="680" y="286" font-size="16" fill="#dbe8fa" text-anchor="start">D1</text><rect x="760" y="260" width="110" height="86" rx="8" fill="#20334f" stroke="#5e789c"/><text x="775" y="304" font-size="18" fill="#dbe8fa" text-anchor="start">D</text><text x="845" y="304" font-size="18" fill="#dbe8fa" text-anchor="start">Q</text><text x="815" y="278" font-size="16" fill="#dbe8fa" text-anchor="middle">DFF</text><path d="M870 298 L1010 298" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="925" y="285" font-size="18" fill="#68dfc3" text-anchor="start">Q1</text><path d="M760 320 L772 328 L760 336" fill="none" stroke="#75b8ff" stroke-width="2"/><path d="M720 328 L760 328" stroke="#75b8ff" stroke-width="2" fill="none"/><path d="M720 328 L720 463" stroke="#75b8ff" stroke-width="2" fill="none"/><text x="35" y="420" font-size="20" fill="#68dfc3" text-anchor="start">Bit 2</text><text x="35" y="450" font-size="15" fill="#dbe8fa" text-anchor="start">Q2 = count[2]</text><text x="190" y="403" font-size="16" fill="#dbe8fa" text-anchor="start">Q1 AND Q0</text><path d="M190 413 L380 413" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="255" y="459" font-size="16" fill="#dbe8fa" text-anchor="start">Q2</text><path d="M290 453 L380 453" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="380" y="395" width="85" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="422" y="441" font-size="20" fill="#dbe8fa" text-anchor="middle">XOR</text><path d="M465 433 L555 433" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="555" y="395" width="95" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="602" y="441" font-size="20" fill="#dbe8fa" text-anchor="middle">AND</text><text x="500" y="386" font-size="14" fill="#ffcf80" text-anchor="start">NOT rst</text><path d="M530 391 L575 391" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M575 391 L575 395" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M650 433 L760 433" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="680" y="421" font-size="16" fill="#dbe8fa" text-anchor="start">D2</text><rect x="760" y="395" width="110" height="86" rx="8" fill="#20334f" stroke="#5e789c"/><text x="775" y="439" font-size="18" fill="#dbe8fa" text-anchor="start">D</text><text x="845" y="439" font-size="18" fill="#dbe8fa" text-anchor="start">Q</text><text x="815" y="413" font-size="16" fill="#dbe8fa" text-anchor="middle">DFF</text><path d="M870 433 L1010 433" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="925" y="420" font-size="18" fill="#68dfc3" text-anchor="start">Q2</text><path d="M760 455 L772 463 L760 471" fill="none" stroke="#75b8ff" stroke-width="2"/><path d="M720 463 L760 463" stroke="#75b8ff" stroke-width="2" fill="none"/><path d="M720 463 L720 598" stroke="#75b8ff" stroke-width="2" fill="none"/><text x="35" y="555" font-size="20" fill="#68dfc3" text-anchor="start">Bit 3</text><text x="35" y="585" font-size="15" fill="#dbe8fa" text-anchor="start">Q3 = count[3]</text><text x="190" y="538" font-size="16" fill="#dbe8fa" text-anchor="start">Q2 AND Q1 AND Q0</text><path d="M190 548 L380 548" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="255" y="594" font-size="16" fill="#dbe8fa" text-anchor="start">Q3</text><path d="M290 588 L380 588" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="380" y="530" width="85" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="422" y="576" font-size="20" fill="#dbe8fa" text-anchor="middle">XOR</text><path d="M465 568 L555 568" stroke="#68dfc3" stroke-width="2" fill="none"/><rect x="555" y="530" width="95" height="78" rx="8" fill="#20334f" stroke="#5e789c"/><text x="602" y="576" font-size="20" fill="#dbe8fa" text-anchor="middle">AND</text><text x="500" y="521" font-size="14" fill="#ffcf80" text-anchor="start">NOT rst</text><path d="M530 526 L575 526" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M575 526 L575 530" stroke="#ffcf80" stroke-width="2" fill="none"/><path d="M650 568 L760 568" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="680" y="556" font-size="16" fill="#dbe8fa" text-anchor="start">D3</text><rect x="760" y="530" width="110" height="86" rx="8" fill="#20334f" stroke="#5e789c"/><text x="775" y="574" font-size="18" fill="#dbe8fa" text-anchor="start">D</text><text x="845" y="574" font-size="18" fill="#dbe8fa" text-anchor="start">Q</text><text x="815" y="548" font-size="16" fill="#dbe8fa" text-anchor="middle">DFF</text><path d="M870 568 L1010 568" stroke="#68dfc3" stroke-width="2" fill="none"/><text x="925" y="555" font-size="18" fill="#68dfc3" text-anchor="start">Q3</text><path d="M760 590 L772 598 L760 606" fill="none" stroke="#75b8ff" stroke-width="2"/><path d="M720 598 L760 598" stroke="#75b8ff" stroke-width="2" fill="none"/><text x="660" y="660" font-size="18" fill="#75b8ff" text-anchor="start">clk</text><path d="M695 653 L720 653" stroke="#75b8ff" stroke-width="2" fill="none"/><path d="M720 653 L720 598" stroke="#75b8ff" stroke-width="2" fill="none"/><text x="35" y="710" font-size="17" fill="#dbe8fa" text-anchor="start">Matching Q labels denote feedback connections. Reset high forces every D input to zero.</text><text x="35" y="743" font-size="15" fill="#9eb4d2" text-anchor="start">Functional schematic derived from src/counter.v; mapped cell implementation is shown separately.</text></g></svg>
